services:
  control-plane:
    image: ${TOMO_STREAMING_CONTROL_PLANE_IMAGE:-ghcr.io/tomo-social/tomo-streaming-control-plane:0.1.0}
    environment:
      PORT: 8090
      TOMO_STREAM_API_KEY: ${TOMO_STREAM_API_KEY:?set TOMO_STREAM_API_KEY}
      AV_STREAM_SERVER_IMAGE: ${TOMO_AV_STREAM_SERVER_IMAGE:-ghcr.io/tomo-social/tomo-av-stream-server:0.1.0}
      STREAM_SERVER_SIGNALING_URL: ${STREAM_SERVER_SIGNALING_URL:-ws://localhost:8090/signaling}
      MAX_STREAM_SESSIONS: ${MAX_STREAM_SESSIONS:-4}
      TOMO_STREAM_INSTANCE_ID: ${TOMO_STREAM_INSTANCE_ID:-self-hosted}
      PUBLIC_IP: ${PUBLIC_IP:-}
      TURN_URL: ${TURN_URL:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_PASSWORD: ${TURN_PASSWORD:-}
      CAMERA_DEVICE_HOST: ${CAMERA_DEVICE_HOST:-}
      X11_SOCKET_HOST: ${X11_SOCKET_HOST:-}
      PULSE_SOCKET_HOST: ${PULSE_SOCKET_HOST:-}
      INPUT_SOCKET_HOST_DIR: ${INPUT_SOCKET_HOST_DIR:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8090:8090"
    restart: unless-stopped
