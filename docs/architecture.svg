<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">Tomo Streaming self-hosted architecture</title>
  <desc id="desc">A browser connects to the control plane, which launches isolated stream server containers that capture media and return WebRTC audio, video and input.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f7f8ff"/><stop offset="1" stop-color="#eef1ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#4f46e5"/></marker>
  </defs>
  <rect width="1100" height="430" rx="24" fill="url(#bg)"/>
  <text x="52" y="58" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#111827">Tomo Streaming · self-hosted flow</text>
  <text x="52" y="86" font-family="Inter,Arial,sans-serif" font-size="15" fill="#5b6475">One control plane, isolated media workers, browser-native WebRTC.</text>
  <g filter="url(#shadow)">
    <rect x="55" y="155" width="190" height="112" rx="16" fill="#fff" stroke="#c7d2fe" stroke-width="2"/>
    <rect x="325" y="135" width="245" height="152" rx="16" fill="#4f46e5"/>
    <rect x="650" y="120" width="245" height="182" rx="16" fill="#111827"/>
  </g>
  <g font-family="Inter,Arial,sans-serif">
    <text x="78" y="190" font-size="13" font-weight="700" fill="#4f46e5">CLIENTS</text>
    <text x="78" y="220" font-size="21" font-weight="700" fill="#111827">Browser / SDK</text>
    <text x="78" y="246" font-size="14" fill="#5b6475">Video · audio · input</text>
    <text x="350" y="172" font-size="13" font-weight="700" fill="#c7d2fe">CONTROL PLANE</text>
    <text x="350" y="207" font-size="22" font-weight="700" fill="#fff">REST + signaling</text>
    <text x="350" y="235" font-size="14" fill="#e0e7ff">API key · sessions · leases</text>
    <text x="350" y="260" font-size="14" fill="#e0e7ff">Docker orchestration</text>
    <text x="675" y="158" font-size="13" font-weight="700" fill="#a5b4fc">ISOLATED WORKER</text>
    <text x="675" y="193" font-size="22" font-weight="700" fill="#fff">Stream server</text>
    <text x="675" y="222" font-size="14" fill="#d1d5db">H.264 / Opus + WebRTC</text>
    <text x="675" y="248" font-size="14" fill="#d1d5db">Camera · desktop · app</text>
    <text x="675" y="274" font-size="14" fill="#d1d5db">Interactive input channel</text>
  </g>
  <path d="M245 211H318" stroke="#4f46e5" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="252" y="198" font-family="Inter,Arial,sans-serif" font-size="12" fill="#4f46e5">HTTPS / WSS</text>
  <path d="M570 211H643" stroke="#4f46e5" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="578" y="198" font-family="Inter,Arial,sans-serif" font-size="12" fill="#4f46e5">Docker API</text>
  <path d="M895 211H1010" stroke="#4f46e5" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="910" y="198" font-family="Inter,Arial,sans-serif" font-size="12" fill="#4f46e5">WebRTC</text>
  <text x="650" y="354" font-family="Inter,Arial,sans-serif" font-size="13" fill="#4b5563">Each room gets its own worker lifecycle.</text>
  <text x="650" y="377" font-family="Inter,Arial,sans-serif" font-size="13" fill="#4b5563">No Tomo Social services are required.</text>
</svg>
